server:
  port: 8080

spring:
  application:
    name: chem-guardian
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/chem_guardian}
    username: ${SPRING_DATASOURCE_USERNAME:chem}
    password: ${SPRING_DATASOURCE_PASSWORD:chem123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

app:
  ai-service-url: ${AI_SERVICE_URL:http://localhost:8000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
