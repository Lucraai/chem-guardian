[project]
name = "chem-ai-service"
version = "0.1.0"
description = "AI service for chemical safety standards advisor"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.112.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "python-multipart>=0.0.9",
  "pypdf>=5.0.0",
  "python-docx>=1.1.2",
  "pillow>=10.4.0",
  "pytesseract>=0.3.13",
  "qdrant-client>=1.11.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]
