services:
  backend-java:
    build:
      context: ./backend-java
    container_name: chem_backend_java
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/chem_guardian
      SPRING_DATASOURCE_USERNAME: chem
      SPRING_DATASOURCE_PASSWORD: chem123
      AI_SERVICE_URL: http://ai-service-python:8000
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - ai-service-python

  ai-service-python:
    build:
      context: ./ai-service-python
    container_name: chem_ai_service
    environment:
      QDRANT_URL: http://qdrant:6333
    ports:
      - "8000:8000"
    depends_on:
      - qdrant

  postgres:
    image: mirror.gcr.io/library/postgres:16
    container_name: chem_postgres
    environment:
      POSTGRES_DB: chem_guardian
      POSTGRES_USER: chem
      POSTGRES_PASSWORD: chem123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: mirror.gcr.io/library/redis:7
    container_name: chem_redis
    ports:
      - "6379:6379"

  qdrant:
    image: ghcr.io/qdrant/qdrant/qdrant:v1.15.3-unprivileged
    container_name: chem_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  minio:
    image: quay.io/minio/minio
    container_name: chem_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  qdrant_data:
  minio_data:
